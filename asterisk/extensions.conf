[ivr]
exten = 100,1,Answer()
 same = n,Set(VOLUME(TX,p)=10)
 same = n,AGI("/root/ivr/agi.py")
 same = n,Hangup()

exten = _0X.,1,NoOp(${EXTEN})
 same = n,Goto(simbanet-sip-trunk,${EXTEN},1)

exten = _256X.,1,NoOp(${EXTEN})
 same = n,Goto(simbanet-sip-trunk,0${EXTEN:3},1)

exten = _+256X.,1,NoOp(${EXTEN})
 same = n,Goto(simbanet-sip-trunk,0${EXTEN:4},1)


[simbanet-sip-trunk]
exten = 100,1,NoOp(${EXTEN})
 same = n,Set(CDR(dialed_number)=${EXTEN})
 same = n,Goto(ivr,100,1)

exten = _X.,1,Set(CDR(dialed_number)=${EXTEN})
 same = n,Dial(SIP/simbanet-sip-trunk/${EXTEN})
 same = n,Hangup()
