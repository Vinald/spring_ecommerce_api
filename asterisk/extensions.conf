[ivr]
exten = 100,1,Answer()
; Set default testing token
 same = n,Set(GLOBAL(token)=e1826b23c1f23176f4ee510c849e1d81)
 same = n,Set(VOLUME(TX,p)=10)
 same = n,Set(CHANNEL(hangup_handler_push)=hangup_handler,s,1(args))
 same = n,AGI(/root/ivr/agi.py)
 same = n,Hangup()

[hangup_handler]
exten = s,1,AGI(/root/ivr/hangup.py)
 same = n,Return()

