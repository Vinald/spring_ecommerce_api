[mappings]
# This custom CDR file  is stored in /var/log/asterisk/cdr_custom/
# This is the csv header (row 1) for the Master.csv file
# "","Caller ID","Source","Destination","Destination context","Channel Name","Destination Channel","Last app executed","Last app's arguments","Time the call started","Time the call was answered","Time the call ended","Duration of the call","Duration of the call once it was answered","ANSWERED,BUSY,NO ANSWER","DOCUMENTATION,BILL,IGNORE","Channel unique id"

# This is the csv header for the call_for_life.csv file
# "","Caller ID","Source","Destination","Destination context","Channel Name","Destination Channel","Last app executed","Last app's arguments","Time the call started","Time the call was answered","Time the call ended","Duration of the call","Duration of the call once it was answered","ANSWERED,BUSY,NO ANSWER","Dialed Number"

ivr_report.csv => ${CSV_QUOTE(${CDR(date)})},${CSV_QUOTE(${CDR(clid)})},${CSV_QUOTE(${CDR(sip_channel)})},${CSV_QUOTE(${CDR(sip_trunk_number)})},${CSV_QUOTE(${CDR(start)})},${CSV_QUOTE(${CDR(answer)})},${CSV_QUOTE(${CDR(end)})},${CSV_QUOTE(${CDR(duration)})},${CSV_QUOTE(${CDR(billsec)})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(dialed_number)})},${CSV_QUOTE(${CDR(call_id)})},${CSV_QUOTE(${CDR(call_direction})},${CSV_QUOTE(${CDR(token})}${CSV_QUOTE(${CDR(application_name})}
;Master.csv => ${CSV_QUOTE(${CDR(clid)})},${CSV_QUOTE(${CDR(src)})},${CSV_QUOTE(${CDR(dst)})},${CSV_QUOTE(${CDR(dcontext)})},${CSV_QUOTE(${CDR(channel)})},${CSV_QUOTE(${CDR(dstchannel)})},${CSV_QUOTE(${CDR(lastapp)})},${CSV_QUOTE(${CDR(lastdata)})},${CSV_QUOTE(${CDR(start)})},${CSV_QUOTE(${CDR(answer)})},${CSV_QUOTE(${CDR(end)})},${CSV_QUOTE(${CDR(duration)})},${CSV_QUOTE(${CDR(billsec)})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(amaflags)})},${CSV_QUOTE(${CDR(accountcode)})},${CSV_QUOTE(${CDR(uniqueid)})},${CSV_QUOTE(${CDR(userfield)})},${CDR(sequence)}
