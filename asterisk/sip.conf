[general]
context=default
disallow=all
allow=ulaw,alaw
qualify=yes
nat=force_rport,comedia
directmedia=no
srvlookup=yes
insecure=invite

; Please uncomment the next register line if your registering to a certain trunk
;register => <username>:<password>@<host/ip>

; Below is the default motech/asterisk user to test calls
[200]
type=friend
context=ivr
host=dynamic
secret=1234

; Uncomment the following peer if your using the register line above
;[sip-provider-trunk]
;type=friend
;context=sip-provider-trunk
;secret=<password>
;host=<ip address / host>
;fromdomain=<ip address / host>
;defaultuser=<username>
