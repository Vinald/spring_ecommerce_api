stages:
  - code-style-check
  - update-repository
  - ivr-dependencies
  - finish-up

update-repository:
  stage: update-repository
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo git reset --hard
    - sudo git fetch -p --all
    - sudo git checkout master
    - sudo git pull
  only:
    - master

ivr-dependencies:
  stage: ivr-dependencies
  script:
    - sudo /bin/bash install.sh

  only:
    - master

code-style-check:
  stage: code-style-check
  script:
    - pwd
    - sudo pip3 install -r requirements.txt
    - sudo flake8 --max-line-length=120 --statistics ./app.py ./agi.py ./src

  only:
    - master

finish-up:
  stage: finish-up
  script:
    - sudo chown -R asterisk:asterisk /root

  only:
    - master
