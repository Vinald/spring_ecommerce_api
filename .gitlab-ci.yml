stages:
  - code-quality-staging
  - code-quality-production
  - build-staging
  - build-production
  - deploy-staging
  - deploy-production

build-staging:
  stage: build-staging
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo git reset --hard
    - sudo git fetch -p --all
    - sudo git checkout $CI_COMMIT_REF_NAME
    - sudo git pull
  tags:
    - ivr-staging
  only:
    - /^v.*$/i

build-production:
  stage: build-production
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo git reset --hard
    - sudo git fetch -p --all
    - sudo git checkout master
    - sudo git pull
  tags:
    - ivr-production
  only:
    - master

deploy-staging:
  stage: deploy-staging
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo /usr/bin/python3 bin/install.py
    - sudo /usr/bin/python3 bin/deploy-web-app.py
    - sudo chown -R asterisk:asterisk /root
  tags:
    - ivr-staging
  only:
    - /^v.*$/i

deploy-production:
  stage: deploy-production
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo /usr/bin/python3 bin/install.py
    - sudo /usr/bin/python3 bin/deploy-web-app.py
    - sudo chown -R asterisk:asterisk /root
  tags:
    - ivr-production
  only:
    - master

code-quality-staging:
  stage: code-quality-staging
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo pip3 install -r requirements.txt
    - sudo flake8 --max-line-length=120 --statistics ./app.py ./agi.py ./src
  tags:
    - ivr-staging
  only:
    - /^v.*$/i

code-quality-production:
  stage: code-quality-production
  script:
    - sudo chown -R gitlab-runner /root
    - cd /root/ivr
    - sudo pip3 install -r requirements.txt
    - sudo flake8 --max-line-length=120 --statistics ./app.py ./agi.py ./src
  tags:
    - ivr-production
  only:
    - master
