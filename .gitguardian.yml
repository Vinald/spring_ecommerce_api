# GitGuardian configuration
# https://docs.gitguardian.com/ggshield-docs/configuration

version: 2

ignore-paths:
  - tests/

ignore-detectors:
  # The strings 'secret', 'pass123', 'OldPass1', 'NewPass1' in test files are
  # placeholder values used only in unit tests — they are not real credentials.
  # The Generic Password detector fires on these because they match common
  # password patterns, but there is no actual secret at risk.
  - name: generic_password
    paths:
      - tests/test_validation_schemas.py
