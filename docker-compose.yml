version: '3.8'
services:
  db:
    container_name: db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme}
      - MYSQL_DATABASE=ivr
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: webapp
    build: ./web
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    environment:
      - npm_config_unsafe_perm=true
      - VUE_APP_API_URL=${VUE_APP_API_URL:-http://localhost:5000}
    ports:
      - "8000:8080"
    depends_on:
      - ivr

  ivr:
    container_name: ivr
    build: .
    network_mode: "host"
    volumes:
      - .:/root/ivr
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  node_modules:
  db_data:
