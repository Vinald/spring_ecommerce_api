version: '3'
services:
  db:
    container_name: db
    image: mysql:5.7.30
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=ivr
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
  cache:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
  web:
    container_name: webapp
    build: ./web
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    environment:
      - npm_config_unsafe_perm=true
    ports:
      - "8000:8080"
  ivr:
    container_name: ivr
    build: .
    network_mode: "host"
    volumes:
      - .:/root/ivr

volumes:
  node_modules:
